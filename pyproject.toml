[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quads"
version = "1.0.0"
description = "QUADS utilities"
requires-python = ">=3.8"
dependencies = [
    "pytdigest==0.1.3",
    "xarray",
    "dask",
    "netCDF4",
    "h5netcdf",
    "cftime",
    "pyyaml",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
